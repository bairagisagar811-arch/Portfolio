<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }



        body {
            background-size: cover;
            background-image: url(background\ image\ my\ portfolio.png);
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }

        .main {
            display: flex;
        }

        .header {
            display: flex;
            flex-direction: column;
            width: 280px;
            min-height: 100vh;
            background-color: rgb(21, 21, 48)
        }

        .profile {

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile img {
            width: 80%;
            background-position: center;
            object-fit: cover;
            object-position: top;
            display: block;
            border-radius: 50%;
            padding: 20px;

        }

        .text {
            color: white;
            text-align: center;
            padding: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .text p {
            font-size: 25px;
        }

        .header2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            gap: 10px;
            font-family: Arial, Helvetica, sans-serif;

        }

        .header2 a {
            color: white;
            padding: 10px;
            text-decoration: none;

        }

        .header2 div {
            width: 200px;
            display: flex;
            justify-content: center;
            border-radius: 10px;

        }

        .header2 div:hover {
            background-color: blueviolet;
        }

        .main2 {
            display: flex;
            flex-direction: column;
            color: rgb(216, 205, 205);
            margin-left: 20px;
        }

        .heading {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            font-size: 30px;
            height: 80px;
            width: 500px;
            margin-top: 50px;
        }
        .heading P{
            color: wheat;
        }

        .frontend {
            height: 200px;
            width: 700px;
            background-color: rgb(52, 46, 56);
            border-radius: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .frontend h3 {
            color: white;
            padding: 10px;
        }

        .bar1 {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .bar1 p {
            margin-top: 10px;
        }

        .bar1 div img {
            margin-top: 8px;
        }

        .bar1 div {
            height: 120px;
            width: 100px;
            background-color: rgb(72, 61, 79);
            text-align: center;
            border-radius: 10px;
            border: 1px solid rgb(136, 112, 159);
        }

        .bar1 div:hover {
            transform: scale(1.1);
            transition: 300ms;
        }

        .otherskills {
            height: 200px;
            width: 700px;
            background-color: rgb(52, 46, 56);
            border-radius: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .otherskills h3 {
            color: white;
            padding: 10px;
            
        }

        .bar2 {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .bar2 p {
            margin-top: 7px;
        }

        .bar2 div img {
            margin-top: 8px;
        }

        .bar2 div {
            height: 120px;
            width: 100px;
            background-color: rgb(72, 61, 79);
            text-align: center;
            border-radius: 10px;
            border: 1px solid rgb(136, 112, 159);
        }

        .bar2 div:hover {
            transform: scale(1.1);
            transition: 300ms;
        }

        .box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 150px;
            margin-bottom: 40px;
        }
@media (max-width: 600px) {

    /* Main layout */
    .main {
        flex-direction: column;
        width: 100%;
    }

    /* Header */
    .header {
        width: 100%;
        min-height: auto;
        padding-bottom: 20px;
    }

    /* Profile */
    .profile img {
        width: 160px;
        height: 160px;
        padding: 10px;
        margin-top: 15px;
    }

    .text {
        padding: 10px;
    }

    .text h2 {
        font-size: 24px;
    }

    .text p {
        font-size: 18px;
    }

    /* Navigation */
    .header2 {
        margin-top: 15px;
        gap: 5px;
        font-size: 16px;
    }

    .header2 div {
        width: 90%;
    }

    .header2 a {
        padding: 8px;
    }


    /* Main Skills Section */
    .main2 {
        width: 100%;
        margin-left: 0;
        padding: 20px;
    }

    /* Heading */
    .heading {
        width: 100%;
        height: auto;
        margin-top: 20px;
        font-size: 20px;
    }

    .heading h1 {
        font-size: 35px;
    }

    .heading p {
        font-size: 15px;
        margin-top: 5px;
    }


    /* Skills boxes */
    .box {
        width: 100%;
        margin-top: 50px;
        margin-bottom: 30px;
        gap: 20px;
    }

    .frontend,
    .otherskills {
        width: 100%;
        height: auto;
        padding-bottom: 20px;
    }

    .frontend h3,
    .otherskills h3 {
        font-size: 18px;
    }


    /* Skill items */
    .bar1,
    .bar2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin: 15px;
    }

    .bar1 div,
    .bar2 div {
        width: 100%;
        height: 110px;
    }

    .bar1 div img,
    .bar2 div img {
        max-width: 55px;
        height: auto;
    }

    .bar1 p,
    .bar2 p {
        font-size: 14px;
    }
}

    </style>
</head>
