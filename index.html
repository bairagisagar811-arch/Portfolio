<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }



        body {
            background-size: cover;
            background-image: url(background\ image\ my\ portfolio.png);
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
        }

        .main {
            display: flex;
        }

        .header {
            display: flex;
            flex-direction: column;
            width: 280px;
            min-height: 100vh;
            background-color: rgb(21, 21, 48)
        }

        .profile {

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile img {
            width: 80%;
            background-position: center;
            object-fit: cover;
            object-position: top;
            display: block;
            border-radius: 50%;
            padding: 20px;

        }

        .text {
            color: white;
            text-align: center;
            padding: 15px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .text p {
            font-size: 25px;
        }

        .header2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            gap: 10px;
            font-family: Arial, Helvetica, sans-serif;

        }

        .header2 a {
            color: white;
            padding: 10px;
            text-decoration: none;

        }

        .header2 div {
            width: 200px;
            display: flex;
            justify-content: center;
            border-radius: 10px;

        }

        .header2 div:hover {
            background-color: blueviolet;
        }

        .name {
            margin-left: 30px;
            margin-top: 250px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .name span {
            font-size: 20px;
            word-spacing: 10px;
            color: wheat;

        }

        .name h1 {
            font-size: 60px;
            margin-top: 30px;
            word-spacing: 8px;

        }

        .name h2 {
            font-size: 40px;
            color: rgb(162, 109, 211);
        }

        .name p {
            margin-top: 20px;
            font-size: 20px;
        }

        .button {
            display: flex;
            gap: 20px;
        }

        .button button {

            margin-top: 20px;
            border: 1px solid white;
            padding: 15px;
            border-radius: 10px;
            color: white;
            background-color: transparent;
            width: 150px;
            font-weight: bold;
        }

        .button button:hover {
            background-color: blueviolet;
            border: none;
        }

    
@media (max-width: 600px) {

    .main {
        flex-direction: column;
        width: 100%;
    }

    /* Header */
    .header {
        width: 100%;
        min-height: auto;
        padding-bottom: 20px;
        margin-bottom: 20px;
    }

    .profile img {
        width: 160px;
        height: 160px;
        padding: 10px;
        margin-top: 15px;
    }

    .text {
        padding: 10px;
    }

    .text h2 {
        font-size: 24px;
    }

    .text p {
        font-size: 18px;
    }

    /* Navigation */
    .header2 {
        margin-top: 15px;
        gap: 5px;
    }

    .header2 div {
        width: 90%;
    }

    .header2 a {
        padding: 8px;
        font-size: 16px;
    }

    /* Home content */
    .name {
        width: 100%;
        margin: 50px 0 50px;
        padding: 0 20px}
    }


    </style>
</head>

<body>
    <div class="main">
        <div class="header">

            <div class="profile">
                <img src="https://tse1.explicit.bing.net/th/id/OIP.UirWc-_agU3sLXPag8vCUQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                    alt="">
            </div>

            <div class="text">
                <h2>Sagar Madadh</h2>
                <p>Frontend Developer</p>
            </div>

            <div class="header2">
                <div><a href="index.html">Home </a><br></div>
                <div><a href="about.html">About </a><br></div>
                <div><a href="skills.html">Skills </a><br></div>
                <div><a href="project.html">Projects </a><br></div>
                <div><a href="contact.html">Contact </a></div>
            </div>
        </div>

        <div class="name">
            <span>WELCOME TO MY PORTFOLIO</span>
            <h1>Sagar Madadh</h1>
            <h2>Frontend Developer </h2>
            <p>I create beautiful and responsive <br>websites with HTML & CSS.</p>

            <div class="button"><button>View My Projects</button>
                <button>Contact</button>
            </div>
        </div>
    </div>
</body>

</html>
